schema: spec-driven

context: |
  AgentForge: a procedure wrapper for the Claude Agent SDK, shared across projects.
  Tech stack: TypeScript, Bun, Nx grouped layout on @aws/nx-plugin, Vitest, Zod, AWS CDK.
  Four layers with a contract at every boundary (docs/ARCHITECTURE.md §1):
  1 runtime (A2A server and client, TaskExecutor, durable task store, deployment constructs),
  2 harness (procedures, the agent() helper and kernel, optional helpers), 3 consumer, 4 Claude Agent SDK.
  Layers 1 and 2 never import each other; they share only the task protocol library.
  Only two crossings are protocols: the A2A wire, and the pipe to a task process.
  A2A is the contract between a caller and the runtime; the client is caller-agnostic and a
  Temporal activity factory sits over it. A task runs in its own process, speaking JSON-RPC
  over a pipe; task state is durable outside the microVM, indexed by a caller-supplied
  idempotency key. AgentForge is delivered as an Nx plugin with CDK constructs; an agent is a
  deployed AgentCore runtime, and agents that share an image nest in one project.
  How a consumer relates runtime sessions, A2A contexts, Claude sessions and working
  directories is the consumer's, never AgentForge's.
  Consumers (StrategyFoundry, TrendBot) state requirements in their own repositories'
  docs/AGENTFORGE_CONTRACT.md (ids H# and T#), which are unvetted drafts; docs/CONSUMERS.md
  distils them into the set AgentForge answers to (ids D#) and records what is not carried.
  Everything in docs/ARCHITECTURE.md and adr/ is proposed, not accepted.

rules:
  proposal:
    - Trace to the distilled requirements it serves (D#), and name those it leaves unmet
    - Name the [OPEN §x] sections it depends on; never resolve one silently
    - Name the protocol or interface it changes, and why the change belongs there
    - Include a "Non-goals" section
    - No consumer domain vocabulary
  design:
    - Include the public API surface with TypeScript signatures
    - Include the error handling strategy and the outcomes each failure maps to
    - Include the failure-injection tests the change adds
  tasks:
    - Break into implementable chunks (1-4 hours each)
    - Include test tasks alongside implementation tasks
