# Defines the checks to skip entirely. Remove if your requirements differ.
# Seeded from the operator's baseline; each project's copy drifts on its own.
skip-check:
  # Lambda function suppressions
  - CKV_AWS_115 # Concurrent execution limit
  - CKV_AWS_116 # Dead Letter Queue
  - CKV_AWS_117 # Lambda functions in VPC
  - CKV_AWS_173 # Encrypt Lambda environment variables
  - CKV_AWS_272 # Code signing
  # KMS
  - CKV_AWS_158 # CloudWatch Log Group
  - CKV_AWS_149 # Secrets Manager
  - CKV_AWS_119 # DynamoDB table
  # S3
  - CKV_AWS_18 # Access logging: only the agents given a bucket use it, through their own roles
output:
  - cli
  - json
output-file-path: console,dist/packages/examples/golden-kata-infra/checkov/checkov_report.json
